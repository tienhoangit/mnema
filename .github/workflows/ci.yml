name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build all workspaces
        run: npm run build

      - name: Run Security Audit Tests
        run: node apps/api/tests/test_security_audit.mjs

      - name: Wrangler Deploy Dry Run
        working-directory: apps/api
        run: npx wrangler deploy --dry-run
